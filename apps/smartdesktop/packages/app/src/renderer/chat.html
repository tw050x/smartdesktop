<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>SmartDesktop</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="chat-window-body">
  <!-- The top bar, as the apps' windows have: the traffic lights (the close button closes the chat),
       and at its right end the chat history (see history-panel.js). It drags the window. -->
  <header class="chat-head">
    <button type="button" class="icon-button chat-history-button" id="history-button" aria-label="Chat history" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    </button>
  </header>
  <!-- The chats, in tabs, in columns side by side (see chat.js). -->
  <main class="chat-grid" id="chat-grid"></main>
  <script type="module" src="./chat.js"></script>
</body>
</html>
