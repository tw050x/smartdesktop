<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SmartStudio's app icon: two white cards, a song's waveform above (the part playing blue) and a
       clip below, its play mark blue and a brown mark beside its lines. SmartDoc's, SmartSpec's,
       SmartAd's, SmartPrep's and SmartPlan's icon shape, white cards, shadows and three colours. The
       source of icon.icns and icon.png (see scripts/make-icons.mjs). -->
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/></filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.16"/></filter>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f9"/><stop offset="1" stop-color="#dcdce3"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#light)" filter="url(#lift)"/>
  <!-- The cards: the song's and the clip's. -->
  <g filter="url(#paper)" fill="#fff">
    <rect x="186" y="206" width="652" height="300" rx="44"/>
    <rect x="186" y="538" width="652" height="280" rx="44"/>
  </g>
  <!-- The song's waveform. -->
  <g>
    <rect x="236" y="324" width="30" height="64" rx="15" fill="#c7c7cf"/>
    <rect x="286" y="302" width="30" height="108" rx="15" fill="#c7c7cf"/>
    <rect x="336" y="280" width="30" height="152" rx="15" fill="#c7c7cf"/>
    <rect x="386" y="309" width="30" height="94" rx="15" fill="#2f6fde"/>
    <rect x="436" y="266" width="30" height="180" rx="15" fill="#2f6fde"/>
    <rect x="486" y="248" width="30" height="216" rx="15" fill="#2f6fde"/>
    <rect x="536" y="277" width="30" height="158" rx="15" fill="#2f6fde"/>
    <rect x="586" y="298" width="30" height="116" rx="15" fill="#c7c7cf"/>
    <rect x="636" y="270" width="30" height="172" rx="15" fill="#c7c7cf"/>
    <rect x="686" y="291" width="30" height="130" rx="15" fill="#c7c7cf"/>
    <rect x="736" y="316" width="30" height="80" rx="15" fill="#c7c7cf"/>
    <rect x="786" y="331" width="30" height="50" rx="15" fill="#c7c7cf"/>
  </g>
  <!-- The clip: its frame with a play mark, and its lines. -->
  <rect x="226" y="578" width="260" height="200" rx="28" fill="#c9c9d2"/>
  <path d="M326 628 L326 728 Q326 744 340 736 L414 690 Q428 678 414 666 L340 620 Q326 612 326 628 Z" fill="#2f6fde"/>
  <g fill="#c7c7cf">
    <rect x="526" y="604" width="272" height="34" rx="17"/>
    <rect x="526" y="660" width="210" height="34" rx="17"/>
  </g>
  <rect x="526" y="716" width="96" height="44" rx="22" fill="#b45309"/>
</svg>
