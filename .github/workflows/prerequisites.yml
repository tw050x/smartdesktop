name: Prerequisites

# Everything that must pass before an app is released, for each app a push changes (all of them
# when something outside apps/ changes, such as packages/ or this workflow), each from its own
# folder: its tests, its interface built, and its website's demo where it has one. An app's Release
# workflow waits for this workflow's run on the commit being released.
on:
  push:

jobs:
  changes:
    name: Which apps changed
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(ls apps | jq -R . | jq -sc .)
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "apps=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -qv '^apps/' <<<"$changed"; then
            echo "apps=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          apps=$(grep '^apps/' <<<"$changed" | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  prerequisites:
    name: ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Skip Electron's download for SmartDesktop
        # Its tests never start Electron; the other apps' setups are as they were.
        if: matrix.app == 'smartdesktop'
        run: echo ELECTRON_SKIP_BINARY_DOWNLOAD=1 >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build the interface
        run: npm run build
      - name: Build the website demo
        run: if npm run | grep -q '^  demo$'; then npm run demo; else echo "No demo"; fi
