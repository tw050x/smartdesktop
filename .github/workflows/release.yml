name: Release

# Releases the family: every app at once, at one version (the user's choice, 2026-11-26: so whatever's
# installed was released together; scripts/set-version.mjs sets it, scripts/check-versions.mjs checks
# it). Run by hand (Actions → Release → Run workflow, or `gh workflow run release.yml -f publish=true`)
# on the branch to release; it goes ahead only once the Prerequisites workflow has passed on the same
# commit (waiting if it's still running). Without "publish" ticked it's a dry run: it builds
# everything and reports what it would release, but creates no tag, release or npm version;
# publishing refuses to run unless the apps are signed and notarised.
#
# The version is released as the tag v<version>, the repository's latest release, holding for each
# app (built side by side, one Mac runner each):
#   - the macOS app, signed and notarised: a disk image per architecture (<Name>-mac-<arch>.dmg) and a
#     zip per architecture with its blockmap (<app>-<version>-mac-<arch>.zip)
#   - its update file, which its updater and its CLI's install read in the latest release: its
#     channel's, <app>-mac.yml (SmartDesktop's latest-mac.yml, as copies of it from before read)
#   - its installer ("Install <Name>.app", packages/installer), signed, notarised and stapled, zipped
#     as Install-<Name>.zip (every app but SmartDesktop, which they install): the websites link to
#     …/releases/latest/download/Install-<Name>.zip
# and SHA256SUMS.txt for them all. Then each app's npm packages already on npm (its CLI, SmartDoc's
# PDF converter) are staged on npm for a maintainer to approve: npm trusts this workflow (trusted
# publishing, set per package on npmjs.com: scripts/trust-release-workflow.sh); a package's first
# version is published by hand, as it has to exist first.
#
# Secrets, one set for every app (scripts/set-release-secrets.sh sets them): CSC_LINK (the Developer
# ID Application certificate as a base64 .p12) and CSC_KEY_PASSWORD; APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for notarising.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (unticked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prerequisites:
    name: Wait for Prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Every app on one version
        id: version
        run: |
          node scripts/check-versions.mjs
          echo "version=$(node -p "require('./apps/smartdesktop/packages/app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check for a successful Prerequisites run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow prerequisites.yml --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No Prerequisites run for $GITHUB_SHA yet. Waiting…"
            else
              status=$(jq -r .status <<<"$run")
              conclusion=$(jq -r .conclusion <<<"$run")
              url=$(jq -r .url <<<"$run")
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Prerequisites passed: $url"
                  exit 0
                fi
                echo "::error::Prerequisites did not pass ($conclusion): $url"
                exit 1
              fi
              echo "Prerequisites is $status: $url. Waiting…"
            fi
            sleep 20
          done

  build:
    name: Build ${{ matrix.app }} (macOS)
    needs: prerequisites
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        app: [smartdoc, smartspec, smartad, smartprep, smartplan, smartstudio, smartdesktop]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: About the app
        id: about
        run: echo "name=$(node -p "require('./apps/$APP/packages/app/package.json').build.productName")" >> "$GITHUB_OUTPUT"

      - run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: Check signing
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISH" = true ]; then
              echo "::error::Publishing needs the apps signed and notarised: set the signing and notarising secrets first (scripts/set-release-secrets.sh)."
              exit 1
            fi
            echo "::warning::Signing secrets aren't set, so this dry run builds unsigned."
          fi

      # electron-builder signs with CSC_LINK and notarises when the APPLE_* variables are set.
      - name: Build the app
        working-directory: apps/${{ matrix.app }}
        # (Unsigned, the signing settings go: electron-builder reads an empty CSC_LINK as this folder.)
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}

      - name: Check the signature and notarisation
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: |
          for zip in dist/$APP-*-mac-*.zip; do
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            codesign --verify --deep --strict --verbose=2 "$dir/$NAME.app"
            spctl --assess --type execute --verbose "$dir/$NAME.app"
            xcrun stapler validate "$dir/$NAME.app"
          done

      # The installer the app's website offers (every app but SmartDesktop, which they install).
      - name: Build the installer
        if: matrix.app != 'smartdesktop'
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: packages/installer/build.sh "$APP" "$NAME" "apps/$APP/dist/installer"

      # Signed with the same certificate as the app (from CSC_LINK, in a keychain of its own),
      # notarised and stapled, so it opens with no warning.
      - name: Sign and notarise the installer
        if: matrix.app != 'smartdesktop' && steps.signing.outputs.signed == 'true'
        working-directory: apps/${{ matrix.app }}/dist/installer
        env:
          NAME: ${{ steps.about.outputs.name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/installer.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in CSC_LINK"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" "Install $NAME.app"
          ditto -c -k --keepParent "Install $NAME.app" notarise.zip
          xcrun notarytool submit notarise.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm notarise.zip
          xcrun stapler staple "Install $NAME.app"
          spctl --assess --type execute --verbose "Install $NAME.app"
          security delete-keychain "$keychain"

      - name: Zip the installer
        if: matrix.app != 'smartdesktop'
        working-directory: apps/${{ matrix.app }}/dist
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: ditto -c -k --keepParent "installer/Install $NAME.app" "Install-$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/dist/${{ matrix.app }}-*-mac-*.zip
            apps/${{ matrix.app }}/dist/${{ matrix.app }}-*-mac-*.zip.blockmap
            apps/${{ matrix.app }}/dist/*-mac-*.dmg
            apps/${{ matrix.app }}/dist/*-mac.yml
            apps/${{ matrix.app }}/dist/Install-*.zip
          if-no-files-found: error

  release:
    name: ${{ inputs.publish && 'Publish' || 'Dry run (no release)' }}
    needs: [prerequisites, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.prerequisites.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the earlier tags, for the release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Write the checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Whether the version is free, and which of the apps' npm packages are on npm already.
      - name: Check the version is free
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          problems=""
          # A GitHub release for this version, with the apps' packages unchanged since its tag, was
          # made by a run that stopped before npm: this run finishes it, on npm only.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...$GITHUB_SHA" \
              --jq '[.files[]?.filename | select(test("^apps/[^/]+/packages/") and (test("^apps/[^/]+/packages/app/") | not))] | length' 2>/dev/null || echo unknown)
            if [ "$changed" = 0 ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "released=true" >> "$GITHUB_OUTPUT"
            else
              problems="$problems Tag $tag already exists."
            fi
          fi
          packages=""
          missing=""
          for json in apps/*/packages/*/package.json; do
            [ "$(node -p "Boolean(require('./$json').private)")" = true ] && continue
            [ "$(node -p "require('./$json').version")" = "$VERSION" ] || continue # (a package of its own version, not released with the apps)
            package=$(node -p "require('./$json').name")
            app=$(echo "$json" | cut -d/ -f2)
            if npm view "$package" name >/dev/null 2>&1; then
              packages="$packages $app:$package"
              if npm view "$package@$VERSION" version >/dev/null 2>&1; then problems="$problems $package@$VERSION is already on npm."; fi
            else
              missing="$missing $package"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -1)" >> "$GITHUB_OUTPUT"
          echo "problems=$problems" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          TAG: ${{ steps.check.outputs.tag }}
          PACKAGES: ${{ steps.check.outputs.packages }}
          MISSING: ${{ steps.check.outputs.missing }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          PUBLISH: ${{ inputs.publish }}
          RELEASED: ${{ steps.check.outputs.released }}
        run: |
          {
            if [ "$PUBLISH" = true ]; then echo "## Releasing $VERSION"; else echo "## Dry run: nothing was released"; fi
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Every app at **$VERSION**, as the tag **$TAG**, the repository's latest release."
            if [ -n "$PACKAGES" ]; then echo "- On npm (staged):$(for one in $PACKAGES; do printf ' %s' "${one#*:}"; done) at $VERSION"; fi
            if [ -n "$MISSING" ]; then echo "- Not on npm yet, so left out:$MISSING (publish each first version by hand, then scripts/trust-release-workflow.sh)."; fi
            if [ "$RELEASED" = true ]; then echo "- The GitHub release $TAG already exists, with the same packages: finishing it, on npm."; fi
            if [ -n "$PROBLEMS" ]; then echo "- ⚠️$PROBLEMS Set a new version: node scripts/set-version.mjs <version>."; fi
            echo "- Files:"
            for f in artifacts/*; do echo "  - $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ] && [ -n "$PROBLEMS" ]; then exit 1; fi

      # The GitHub release comes first: the npm packages download the apps from it.
      - name: Create the GitHub release
        if: inputs.publish && steps.check.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "SmartDesktop $VERSION" --latest \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

      # Staged: the trusted publisher only allows `npm stage publish` (npm 11.15.0 or later; Node 22
      # comes with npm 10), so each version waits on npmjs.com until a maintainer approves it.
      - name: Stage on npm
        if: inputs.publish && steps.check.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.check.outputs.packages }}
        run: |
          npm install -g npm@^11.15.0
          for one in $PACKAGES; do
            (cd "apps/${one%%:*}" && npm stage publish -w "${one#*:}" --provenance --access public)
          done
