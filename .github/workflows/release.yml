name: Release

# Releases one app of the family (the one chosen) from this repository, run by hand (Actions → Release
# → Run workflow, or `gh workflow run release.yml -f app=smartplan -f publish=true`) on the branch to
# release. It goes ahead only once the Prerequisites workflow has passed on the same commit (waiting
# if it's still running). Without "publish" ticked it's a dry run: it builds everything and reports
# what it would release, but creates no tag, release or npm version; publishing refuses to run unless
# the app is signed and notarised.
#
# An app's version (its packages/app/package.json; its packages' must match, its tests check) is
# released as the tag <app>-v<version>, with:
#   - the macOS app, signed and notarised: a disk image per architecture (<Name>-mac-<arch>.dmg) and
#     a zip per architecture with its blockmap (what the updater and the installer download)
#   - its installer ("Install <Name>.app", packages/installer), signed, notarised and stapled, zipped
#     as Install-<Name>.zip (every app but SmartDesktop, which they install)
#   - SHA256SUMS.txt
# Then the app's update feed, the release <app>-updates (made the first time, as a pre-release so it
# never shows as the repository's latest), gets this version's latest-mac.yml, each file named by its
# address in <app>-v<version> (scripts/release-feed.mjs), which the app's updater and its CLI's
# install read; and the installer, at an address that doesn't change for the website to link to
# (…/releases/download/<app>-updates/Install-<Name>.zip). The family's apps share this repository,
# whose single "latest" release can't be every app's, so each app reads its own feed.
# Last, each of the app's npm packages already on npm (its CLI, and SmartDoc's PDF converter) is
# staged on npm for a maintainer to approve: npm trusts this workflow (trusted publishing, set per
# package on npmjs.com); a package's first version is published by hand, as it has to exist first.
#
# Secrets, one set for every app (scripts/set-release-secrets.sh sets them): CSC_LINK (the Developer
# ID Application certificate as a base64 .p12) and CSC_KEY_PASSWORD; APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for notarising.
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to release
        type: choice
        required: true
        options: [smartdoc, smartspec, smartad, smartprep, smartplan, smartstudio, smartdesktop]
      publish:
        description: Publish the release (unticked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  APP: ${{ inputs.app }}

jobs:
  prerequisites:
    name: Wait for Prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for a successful Prerequisites run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow prerequisites.yml --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No Prerequisites run for $GITHUB_SHA yet. Waiting…"
            else
              status=$(jq -r .status <<<"$run")
              conclusion=$(jq -r .conclusion <<<"$run")
              url=$(jq -r .url <<<"$run")
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Prerequisites passed: $url"
                  exit 0
                fi
                echo "::error::Prerequisites did not pass ($conclusion): $url"
                exit 1
              fi
              echo "Prerequisites is $status: $url. Waiting…"
            fi
            sleep 20
          done

  build:
    name: Build ${{ inputs.app }} (macOS)
    needs: prerequisites
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: About the app
        id: about
        run: |
          echo "name=$(node -p "require('./apps/$APP/packages/app/package.json').build.productName")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./apps/$APP/packages/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci
        working-directory: apps/${{ inputs.app }}

      - name: Check signing
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISH" = true ]; then
              echo "::error::Publishing needs the app signed and notarised: set the signing and notarising secrets first (scripts/set-release-secrets.sh)."
              exit 1
            fi
            echo "::warning::Signing secrets aren't set, so this dry run builds the app unsigned."
          fi

      # electron-builder signs with CSC_LINK and notarises when the APPLE_* variables are set.
      - name: Build the app
        working-directory: apps/${{ inputs.app }}
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}

      - name: Check the signature and notarisation
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/${{ inputs.app }}
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: |
          for zip in dist/$APP-*-mac-*.zip; do
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            codesign --verify --deep --strict --verbose=2 "$dir/$NAME.app"
            spctl --assess --type execute --verbose "$dir/$NAME.app"
            xcrun stapler validate "$dir/$NAME.app"
          done

      # The installer the app's website offers (every app but SmartDesktop, which they install).
      - name: Build the installer
        if: inputs.app != 'smartdesktop'
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: packages/installer/build.sh "$APP" "$NAME" "apps/$APP/dist/installer"

      # Signed with the same certificate as the app (from CSC_LINK, in a keychain of its own),
      # notarised and stapled, so it opens with no warning.
      - name: Sign and notarise the installer
        if: inputs.app != 'smartdesktop' && steps.signing.outputs.signed == 'true'
        working-directory: apps/${{ inputs.app }}/dist/installer
        env:
          NAME: ${{ steps.about.outputs.name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/installer.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in CSC_LINK"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" "Install $NAME.app"
          ditto -c -k --keepParent "Install $NAME.app" notarise.zip
          xcrun notarytool submit notarise.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm notarise.zip
          xcrun stapler staple "Install $NAME.app"
          spctl --assess --type execute --verbose "Install $NAME.app"
          security delete-keychain "$keychain"

      - name: Zip the installer
        if: inputs.app != 'smartdesktop'
        working-directory: apps/${{ inputs.app }}/dist
        env:
          NAME: ${{ steps.about.outputs.name }}
        run: ditto -c -k --keepParent "installer/Install $NAME.app" "Install-$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            apps/${{ inputs.app }}/dist/${{ inputs.app }}-*-mac-*.zip
            apps/${{ inputs.app }}/dist/${{ inputs.app }}-*-mac-*.zip.blockmap
            apps/${{ inputs.app }}/dist/*-mac-*.dmg
            apps/${{ inputs.app }}/dist/latest-mac.yml
            apps/${{ inputs.app }}/dist/Install-*.zip
          if-no-files-found: error

  release:
    name: ${{ inputs.publish && 'Publish' || 'Dry run (no release)' }} ${{ inputs.app }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the app's earlier tags, for the release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts

      - name: Write the checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The app's version, whether it's free, and which of its npm packages are on npm already.
      - name: Check the version is free
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/$APP/packages/app/package.json').version")
          name=$(node -p "require('./apps/$APP/packages/app/package.json').build.productName")
          tag="$APP-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          problems=""
          # A GitHub release for this version, with the app's packages unchanged since its tag, was
          # made by a run that stopped before npm: this run finishes it, on npm only.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...$GITHUB_SHA" \
              --jq "[.files[]?.filename | select(startswith(\"apps/$APP/packages/\") and (startswith(\"apps/$APP/packages/app/\") | not))] | length" 2>/dev/null || echo unknown)
            if [ "$changed" = 0 ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "released=true" >> "$GITHUB_OUTPUT"
            else
              problems="$problems Tag $tag already exists."
            fi
          fi
          packages=""
          missing=""
          for json in apps/$APP/packages/*/package.json; do
            [ "$(node -p "Boolean(require('./$json').private)")" = true ] && continue
            package=$(node -p "require('./$json').name")
            if npm view "$package" name >/dev/null 2>&1; then
              packages="$packages $package"
              if npm view "$package@$version" version >/dev/null 2>&1; then problems="$problems $package@$version is already on npm."; fi
            else
              missing="$missing $package"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag --list "$APP-v*" --sort=-v:refname | grep -vx "$tag" | head -1)" >> "$GITHUB_OUTPUT"
          echo "problems=$problems" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGES: ${{ steps.version.outputs.packages }}
          MISSING: ${{ steps.version.outputs.missing }}
          PROBLEMS: ${{ steps.version.outputs.problems }}
          SIGNED: ${{ needs.build.outputs.signed }}
          PUBLISH: ${{ inputs.publish }}
          RELEASED: ${{ steps.version.outputs.released }}
        run: |
          {
            if [ "$PUBLISH" = true ]; then echo "## Releasing $APP $VERSION"; else echo "## Dry run: nothing was released"; fi
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version **$VERSION** as tag **$TAG**, and the update feed **$APP-updates**."
            echo "- Signed and notarised: $SIGNED"
            if [ -n "$PACKAGES" ]; then echo "- On npm (staged):$PACKAGES at $VERSION"; fi
            if [ -n "$MISSING" ]; then echo "- Not on npm yet, so left out:$MISSING (publish each first version by hand, then trust this workflow)."; fi
            if [ "$RELEASED" = true ]; then echo "- The GitHub release $TAG already exists, with the same packages: finishing it, on npm."; fi
            if [ -n "$PROBLEMS" ]; then echo "- ⚠️$PROBLEMS Bump the version in apps/$APP's package.json files."; fi
            echo "- Files:"
            for f in artifacts/*; do echo "  - $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ] && [ -n "$PROBLEMS" ]; then exit 1; fi

      # The GitHub release comes first: the update feed and the npm packages download the app from it.
      - name: Create the GitHub release
        if: inputs.publish && steps.version.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          # Only SmartDesktop's releases are the repository's latest: copies of it installed before
          # the apps moved here read this repository's latest release for updates (each app's later
          # copies read their own feed).
          latest=false
          if [ "$APP" = smartdesktop ]; then latest=true; fi
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "$NAME $VERSION" --latest=$latest \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

      # The app's update feed: this version's latest-mac.yml, naming its files by their addresses in
      # the release just made, and the installer at an address that doesn't change.
      - name: Update the app's feed
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir feed
          node scripts/release-feed.mjs artifacts/latest-mac.yml "$APP" "$VERSION" "$GITHUB_REPOSITORY" > feed/latest-mac.yml
          cat feed/latest-mac.yml
          if ! gh release view "$APP-updates" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$APP-updates" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$NAME updates" --notes "$NAME's update feed: the latest version's latest-mac.yml, which the app's updater reads, and its installer. Each version's own release is tagged $APP-v<version>."
          fi
          files=(feed/latest-mac.yml)
          for installer in artifacts/Install-*.zip; do [ -e "$installer" ] && files+=("$installer"); done
          gh release upload "$APP-updates" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # Staged: the trusted publisher only allows `npm stage publish` (npm 11.15.0 or later; Node 22
      # comes with npm 10), so each version waits on npmjs.com until a maintainer approves it.
      - name: Stage on npm
        if: inputs.publish && steps.version.outputs.packages != ''
        working-directory: apps/${{ inputs.app }}
        env:
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: |
          npm install -g npm@^11.15.0
          for package in $PACKAGES; do
            npm stage publish -w "$package" --provenance --access public
          done
