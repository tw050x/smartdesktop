name: Website

# Publishes site/ (smartdesktop.tw050x.net) to GitHub Pages whenever it changes on master, or by
# hand. It's a plain page, with nothing to build: its still of the chat window (site/shots) is
# made by hand from a test copy of the app. Needs Pages turned on with "GitHub Actions" as its
# source (Settings → Pages).
on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
